name = "changuito-comunidad"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sitios que pueden cargar precios (el de GitHub Pages y la vista previa local).
ORIGENES = "https://enri-escaray.github.io,http://localhost:8782"

[[d1_databases]]
binding = "DB"
database_name = "changuito-comunidad"
# Lo da `npx wrangler d1 create changuito-comunidad`.
database_id = "COMPLETAR_CON_EL_ID_DE_D1"

# Secretos (no van en este archivo; se cargan con `npx wrangler secret put NOMBRE`):
#   TURNSTILE_SECRET  la Secret Key del widget de Turnstile
#   ADMIN_TOKEN       la clave para entrar a /admin
#   SAL_IP            un texto al azar para el hash de las IP
