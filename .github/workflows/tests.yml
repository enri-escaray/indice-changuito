name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Correr tests
        run: pytest -q

      - name: Correr tests del servidor de la comunidad
        run: node --test comunidad/test/reglas.test.js
