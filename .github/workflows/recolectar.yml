name: Recolección diaria

on:
  schedule:
    - cron: "0 15 * * *" # 12:00 en Argentina (UTC-3)
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: recoleccion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install .

      - name: Recolectar precios, calcular el índice y generar el sitio
        run: changuito actualizar

      - name: Guardar los datos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar"
            exit 0
          fi
          git commit -m "Precios del $(TZ=America/Argentina/Buenos_Aires date +%F)"
          git push
