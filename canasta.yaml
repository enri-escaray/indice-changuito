# Canasta del Índice Changuito
#
# Cada categoría tiene un peso y una lista de productos identificados por su
# código de barras (EAN). Los pesos se normalizan solos: no hace falta que sumen 100.
#
# ⚠️ Pesos PROVISORIOS: son una aproximación propia de cómo se reparte el gasto
# en el supermercado. El próximo paso es reemplazarlos por las ponderaciones
# del IPC del INDEC. No incluye carnes, frutas ni verduras frescas: se venden
# por peso y cada cadena usa códigos propios, así que no se pueden comparar por EAN.
#
# Para buscar el EAN de un producto nuevo:
#   python -m changuito buscar "aceite girasol" --tienda carrefour

